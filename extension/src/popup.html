<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Veritext Local AI</title>
  <style>
    body {
      width: 340px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
      color: #0f172a;
      background: #f8fafc;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .title {
      font-weight: 700;
      font-size: 14px;
      color: #4338ca;
    }
    .badge {
      font-size: 10px;
      font-weight: 600;
      background: #e0e7ff;
      color: #3730a3;
      padding: 2px 6px;
      border-radius: 9999px;
    }
    textarea {
      width: 100%;
      height: 90px;
      box-sizing: border-box;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 8px;
      font-size: 12px;
      font-family: inherit;
      resize: none;
      outline: none;
    }
    textarea:focus {
      border-color: #6366f1;
    }
    .btn-group {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    button {
      flex: 1;
      padding: 7px;
      border-radius: 6px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      font-size: 11px;
    }
    .btn-primary {
      background: #0f172a;
      color: #ffffff;
    }
    .btn-primary:hover {
      background: #1e293b;
    }
    .btn-secondary {
      background: #e2e8f0;
      color: #334155;
    }
    .btn-secondary:hover {
      background: #cbd5e1;
    }
    .result {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      display: none;
    }
    .gauge-wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .score {
      font-size: 18px;
      font-weight: 800;
      font-family: monospace;
    }
    .alert-banner {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      padding: 6px;
      border-radius: 6px;
      font-size: 11px;
      margin-top: 6px;
      font-weight: 600;
      display: none;
    }
    .clean-box {
      margin-top: 8px;
      padding: 6px;
      background: #f1f5f9;
      border-radius: 6px;
      font-size: 11px;
      max-height: 80px;
      overflow-y: auto;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="title">Veritext Local AI</span>
    <span class="badge">Zero-Token V3</span>
  </div>

  <textarea id="input-text" placeholder="Paste prose here to analyze with 100% local stylometrics..."></textarea>

  <div class="btn-group">
    <button id="scan-btn" class="btn-primary">Scan AI Risk</button>
    <button id="clean-btn" class="btn-secondary">Quick De-AI</button>
  </div>

  <div id="alert-box" class="alert-banner">
    ⚠️ Adversarial Obfuscation Detected & Normalized
  </div>

  <div id="result-box" class="result">
    <div class="gauge-wrap">
      <span id="verdict-label" style="font-weight: 600;">Evaluating...</span>
      <span id="score-val" class="score">--%</span>
    </div>
    <div id="telemetry" style="font-size: 11px; color: #64748b; font-family: monospace;"></div>
    <div id="clean-output" class="clean-box"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
